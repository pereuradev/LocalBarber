<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBarber | Faturamento</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png?v=20260715">
  <script src="../assets/js/theme-init.js?v=6"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/sistema.css?v=10">
</head>
<body>
  <aside class="sidebar sidebar-carregando" id="barra-lateral" aria-busy="true"></aside>
  <div class="principal">
    <header id="barra-superior"></header>
    <main class="conteudo">
      <section class="cabecalho-pagina">
        <div>
          <h1>Faturamento</h1>
          <p>Relatório calculado a partir das transações concluídas do período.</p>
        </div>
      </section>

      <div class="barra-filtros">
        <div class="abas" id="periodos-faturamento">
          <button class="aba" type="button" data-periodo="hoje">Hoje</button>
          <button class="aba" type="button" data-periodo="semana">7 dias</button>
          <button class="aba ativa" type="button" data-periodo="mes">Mês</button>
          <button class="aba" type="button" data-periodo="ano">Ano</button>
        </div>
        <input class="campo" id="data-inicio" type="date" aria-label="Data inicial">
        <input class="campo" id="data-fim" type="date" aria-label="Data final">
        <button class="botao botao-primario" id="aplicar-periodo" type="button">Aplicar</button>
      </div>

      <section class="grade-kpi">
        <article class="cartao-kpi"><div class="rotulo-kpi">Faturamento</div><div class="valor-kpi" id="kpi-faturamento">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Despesas</div><div class="valor-kpi" id="kpi-despesas">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Saldo</div><div class="valor-kpi" id="kpi-saldo">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Ticket médio</div><div class="valor-kpi" id="kpi-ticket">—</div></article>
      </section>

      <section class="painel">
        <div class="cabecalho-painel">
          <h2>Entradas e saídas por dia</h2>
          <span class="texto-suave" id="quantidade-concluidas"></span>
        </div>
        <div class="corpo-painel">
          <div class="grafico-barras" id="grafico-faturamento" style="min-height:260px"></div>
        </div>
      </section>

      <section class="grade-2">
        <article class="painel">
          <div class="cabecalho-painel"><h2>Serviços e descrições com maior receita</h2></div>
          <div class="tabela-responsiva" id="ranking-servicos"></div>
        </article>
        <article class="painel">
          <div class="cabecalho-painel"><h2>Formas de pagamento</h2></div>
          <div class="tabela-responsiva" id="resumo-metodos"></div>
        </article>
      </section>
    </main>
  </div>

  <script src="../assets/js/api-localbarber.js?v=7"></script>
  <script src="../assets/js/faturamento-dados.js"></script>
  <script src="../assets/js/theme-toggle.js"></script>
</body>
</html>
