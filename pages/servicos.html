<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBarber | Serviços</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png?v=20260715">
  <script src="../assets/js/theme-init.js?v=6"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/sistema.css?v=13">
</head>
<body>
  <aside class="sidebar sidebar-carregando" id="barra-lateral" aria-busy="true"></aside>
  <div class="principal">
    <header id="barra-superior"></header>
    <main class="conteudo">
      <section class="cabecalho-pagina">
        <div>
          <h1>Serviços</h1>
          <p>Preços, duração e comissão usados diretamente nos agendamentos.</p>
        </div>
        <button class="botao botao-primario" id="novo-servico" type="button"
          data-permissao="servicos.gerenciar">Novo serviço</button>
      </section>

      <section class="grade-kpi">
        <article class="cartao-kpi"><div class="rotulo-kpi">Cadastrados</div><div class="valor-kpi" id="kpi-total">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Ativos</div><div class="valor-kpi" id="kpi-ativos">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Duração média</div><div class="valor-kpi" id="kpi-duracao">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Preço médio</div><div class="valor-kpi" id="kpi-preco">—</div></article>
      </section>

      <div class="barra-filtros">
        <input class="campo campo-busca" id="busca-servicos" type="search" placeholder="Buscar serviço">
        <select class="selecao" id="categoria-servicos"><option value="">Todas as categorias</option></select>
      </div>

      <section class="painel">
        <div class="cabecalho-painel">
          <h2>Catálogo</h2>
          <span class="texto-suave" id="quantidade-servicos"></span>
        </div>
        <div class="tabela-responsiva" id="conteudo-servicos"></div>
      </section>
    </main>
  </div>

  <div class="modal-fundo" id="modal-servico" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-servico">
    <div class="modal">
      <form id="formulario-servico">
        <div class="modal-cabecalho">
          <h2 id="titulo-modal-servico">Novo serviço</h2>
          <button class="botao botao-icone" type="button" data-fechar-modal aria-label="Fechar">×</button>
        </div>
        <div class="modal-corpo">
          <div class="grade-formulario">
            <div class="grupo-campo campo-largo">
              <label for="servico-nome">Nome *</label>
              <input class="campo" id="servico-nome" name="nome" maxlength="160" required>
            </div>
            <div class="grupo-campo campo-largo">
              <label for="servico-descricao">Descrição</label>
              <textarea class="area-texto" id="servico-descricao" name="descricao" maxlength="1500"></textarea>
            </div>
            <div class="grupo-campo">
              <label for="servico-preco">Preço *</label>
              <input class="campo" id="servico-preco" name="preco" type="number" min="0" max="1000000" step="0.01" required>
            </div>
            <div class="grupo-campo">
              <label for="servico-duracao">Duração em minutos *</label>
              <input class="campo" id="servico-duracao" name="duracao_minutos" type="number" min="5" max="1440" step="5" required>
            </div>
            <div class="grupo-campo">
              <label for="servico-categoria">Categoria</label>
              <input class="campo" id="servico-categoria" name="categoria" maxlength="100" list="categorias-disponiveis">
              <datalist id="categorias-disponiveis"></datalist>
            </div>
            <div class="grupo-campo">
              <label for="servico-comissao">Comissão (%) *</label>
              <input class="campo" id="servico-comissao" name="comissao_percentual" type="number" min="0" max="100" step="0.01" value="50" required>
            </div>
            <div class="grupo-campo campo-largo">
              <label for="servico-imagem">URL da imagem</label>
              <input class="campo" id="servico-imagem" name="imagem_url" type="url" maxlength="2048" placeholder="https://">
            </div>
            <div class="grupo-campo campo-largo">
              <label><input id="servico-ativo" name="ativo" type="checkbox" checked> Serviço ativo</label>
            </div>
          </div>
        </div>
        <div class="modal-rodape">
          <button class="botao" type="button" data-fechar-modal>Cancelar</button>
          <button class="botao botao-primario" id="salvar-servico" type="submit">Salvar serviço</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/api-localbarber.js?v=7"></script>
  <script src="../assets/js/servicos-dados.js?v=2"></script>
  <script src="../assets/js/theme-toggle.js?v=2"></script>
</body>
</html>
