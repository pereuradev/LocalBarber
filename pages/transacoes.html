<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBarber | Transações</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png?v=20260715">
  <script src="../assets/js/theme-init.js?v=6"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/sistema.css?v=20260910">
</head>
<body>
  <aside class="sidebar sidebar-carregando" id="barra-lateral" aria-busy="true"></aside>
  <div class="principal">
    <header id="barra-superior"></header>
    <main class="conteudo">
      <section class="cabecalho-pagina">
        <div>
          <h1>Transações</h1>
          <p>Entradas e saídas registradas no banco, sem valores de demonstração.</p>
        </div>
        <button class="botao botao-primario" id="nova-transacao" type="button">Nova transação</button>
      </section>

      <section class="grade-kpi">
        <article class="cartao-kpi"><div class="rotulo-kpi">Entradas</div><div class="valor-kpi" id="kpi-entradas">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Saídas</div><div class="valor-kpi" id="kpi-saidas">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Saldo</div><div class="valor-kpi" id="kpi-saldo">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Registros no período</div><div class="valor-kpi" id="kpi-total">—</div></article>
      </section>

      <div class="barra-filtros">
        <input class="campo campo-busca" id="busca-transacoes" type="search" placeholder="Buscar descrição, cliente ou serviço">
        <select class="selecao" id="metodo-transacoes">
          <option value="">Todos os pagamentos</option>
          <option value="pix">Pix</option><option value="credito">Crédito</option>
          <option value="debito">Débito</option><option value="dinheiro">Dinheiro</option>
          <option value="outro">Outro</option>
        </select>
        <select class="selecao" id="situacao-transacoes">
          <option value="">Todos os status</option>
          <option value="pendente">Pendente</option><option value="confirmado">Confirmado</option>
          <option value="concluido">Concluído</option><option value="cancelado">Cancelado</option>
        </select>
        <div class="abas" id="periodos-transacoes">
          <button class="aba ativa" type="button" data-periodo="hoje">Hoje</button>
          <button class="aba" type="button" data-periodo="semana">Semana</button>
          <button class="aba" type="button" data-periodo="mes">Mês</button>
          <button class="aba" type="button" data-periodo="todos">Todos</button>
        </div>
      </div>

      <section class="painel">
        <div class="cabecalho-painel">
          <h2>Movimentações</h2>
          <span class="texto-suave" id="quantidade-transacoes"></span>
        </div>
        <div class="tabela-responsiva" id="conteudo-transacoes"></div>
      </section>
    </main>
  </div>

  <div class="modal-fundo" id="modal-transacao" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-transacao">
    <div class="modal">
      <form id="formulario-transacao">
        <div class="modal-cabecalho">
          <h2 id="titulo-modal-transacao">Nova transação</h2>
          <button class="botao botao-icone" type="button" data-fechar-modal aria-label="Fechar">×</button>
        </div>
        <div class="modal-corpo">
          <div class="grade-formulario">
            <div class="grupo-campo">
              <label for="transacao-tipo">Tipo *</label>
              <select class="selecao" id="transacao-tipo" name="tipo" required>
                <option value="entrada">Entrada</option><option value="saida">Saída</option>
              </select>
            </div>
            <div class="grupo-campo">
              <label for="transacao-valor">Valor *</label>
              <input class="campo" id="transacao-valor" name="valor" type="number" min="0.01" max="100000000" step="0.01" required>
            </div>
            <div class="grupo-campo campo-largo">
              <label for="transacao-descricao">Descrição *</label>
              <input class="campo" id="transacao-descricao" name="descricao" maxlength="255" required>
            </div>
            <div class="grupo-campo">
              <label for="transacao-metodo">Método de pagamento *</label>
              <select class="selecao" id="transacao-metodo" name="metodo_pagamento" required>
                <option value="pix">Pix</option><option value="credito">Crédito</option>
                <option value="debito">Débito</option><option value="dinheiro">Dinheiro</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div class="grupo-campo">
              <label for="transacao-status">Status *</label>
              <select class="selecao" id="transacao-status" name="status" required>
                <option value="concluido">Concluído</option><option value="pendente">Pendente</option>
                <option value="confirmado">Confirmado</option><option value="cancelado">Cancelado</option>
              </select>
            </div>
            <div class="grupo-campo campo-largo">
              <label for="transacao-data">Data e horário *</label>
              <input class="campo" id="transacao-data" name="data_transacao" type="datetime-local" required>
            </div>
            <div class="grupo-campo">
              <label for="transacao-cliente">Cliente</label>
              <select class="selecao" id="transacao-cliente" name="cliente_id"><option value="">Não vincular</option></select>
            </div>
            <div class="grupo-campo">
              <label for="transacao-servico">Serviço</label>
              <select class="selecao" id="transacao-servico" name="servico_id"><option value="">Não vincular</option></select>
            </div>
            <div class="grupo-campo campo-largo">
              <label for="transacao-funcionario">Profissional</label>
              <select class="selecao" id="transacao-funcionario" name="funcionario_id"><option value="">Não vincular</option></select>
            </div>
            <div class="grupo-campo campo-largo">
              <label for="transacao-observacoes">Observações</label>
              <textarea class="area-texto" id="transacao-observacoes" name="observacoes" maxlength="1500"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-rodape">
          <button class="botao" type="button" data-fechar-modal>Cancelar</button>
          <button class="botao botao-primario" type="submit">Salvar transação</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/api-localbarber.js?v=20260910"></script>
  <script src="../assets/js/transacoes-dados.js?v=20260910"></script>
  <script src="../assets/js/theme-toggle.js?v=2"></script>
</body>
</html>
