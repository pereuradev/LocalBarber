<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBarber | Clientes</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png?v=20260715">
  <script src="../assets/js/theme-init.js?v=6"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/sistema.css?v=10">
</head>
<body>
  <aside class="sidebar sidebar-carregando" id="barra-lateral" aria-busy="true"></aside>
  <div class="principal">
    <header id="barra-superior"></header>
    <main class="conteudo">
      <section class="cabecalho-pagina">
        <div>
          <h1>Clientes</h1>
          <p>Cadastre contatos reais e acompanhe o histórico calculado pelo banco.</p>
        </div>
        <button class="botao botao-primario" id="novo-cliente" type="button">Novo cliente</button>
      </section>

      <section class="grade-kpi">
        <article class="cartao-kpi"><div class="rotulo-kpi">Total</div><div class="valor-kpi" id="kpi-total">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Ativos</div><div class="valor-kpi" id="kpi-ativos">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Visitaram em 30 dias</div><div class="valor-kpi" id="kpi-recentes">—</div></article>
        <article class="cartao-kpi"><div class="rotulo-kpi">Receita registrada</div><div class="valor-kpi" id="kpi-valor">—</div></article>
      </section>

      <div class="barra-filtros">
        <input class="campo campo-busca" id="busca-clientes" type="search" placeholder="Buscar por nome, telefone ou e-mail">
        <select class="selecao" id="situacao-clientes">
          <option value="">Todos</option>
          <option value="ativos">Ativos</option>
          <option value="inativos">Inativos</option>
        </select>
      </div>

      <section class="painel">
        <div class="cabecalho-painel">
          <h2>Lista de clientes</h2>
          <span class="texto-suave" id="quantidade-clientes"></span>
        </div>
        <div class="tabela-responsiva" id="conteudo-clientes"></div>
      </section>
    </main>
  </div>

  <div class="modal-fundo" id="modal-cliente" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-cliente">
    <div class="modal">
      <form id="formulario-cliente">
        <div class="modal-cabecalho">
          <h2 id="titulo-modal-cliente">Novo cliente</h2>
          <button class="botao botao-icone" type="button" data-fechar-modal aria-label="Fechar">×</button>
        </div>
        <div class="modal-corpo">
          <div class="grade-formulario">
            <div class="grupo-campo campo-largo">
              <label for="cliente-nome">Nome *</label>
              <input class="campo" id="cliente-nome" name="nome" maxlength="160" required>
            </div>
            <div class="grupo-campo">
              <label for="cliente-telefone">Telefone *</label>
              <input class="campo" id="cliente-telefone" name="telefone" maxlength="30" required>
            </div>
            <div class="grupo-campo">
              <label for="cliente-email">E-mail</label>
              <input class="campo" id="cliente-email" name="email" type="email" maxlength="254">
            </div>
            <div class="grupo-campo campo-largo">
              <label for="cliente-cidade">Cidade</label>
              <input class="campo" id="cliente-cidade" name="cidade" maxlength="120">
            </div>
            <div class="grupo-campo campo-largo">
              <label for="cliente-observacoes">Observações</label>
              <textarea class="area-texto" id="cliente-observacoes" name="observacoes" maxlength="1500"></textarea>
            </div>
            <div class="grupo-campo campo-largo oculto" id="grupo-cliente-ativo">
              <label><input id="cliente-ativo" name="ativo" type="checkbox" checked> Cliente ativo</label>
            </div>
          </div>
        </div>
        <div class="modal-rodape">
          <button class="botao" type="button" data-fechar-modal>Cancelar</button>
          <button class="botao botao-primario" id="salvar-cliente" type="submit">Salvar cliente</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/api-localbarber.js?v=7"></script>
  <script src="../assets/js/clientes-dados.js"></script>
  <script src="../assets/js/theme-toggle.js"></script>
</body>
</html>
