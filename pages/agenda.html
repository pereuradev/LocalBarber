<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBarber | Agenda</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png?v=20260715">
  <script src="../assets/js/theme-init.js?v=6"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/sistema.css?v=10">
</head>
<body>
  <aside class="sidebar sidebar-carregando" id="barra-lateral" aria-busy="true"></aside>
  <div class="principal">
    <header id="barra-superior"></header>
    <main class="conteudo">
      <section class="cabecalho-pagina">
        <div>
          <h1>Agenda</h1>
          <p>Agendamentos reais organizados por semana, profissional e status.</p>
        </div>
        <button class="botao botao-primario" id="novo-agendamento" type="button">Novo agendamento</button>
      </section>

      <div class="barra-filtros">
        <button class="botao" id="semana-anterior" type="button" aria-label="Semana anterior">←</button>
        <button class="botao" id="semana-atual" type="button">Hoje</button>
        <button class="botao" id="proxima-semana" type="button" aria-label="Próxima semana">→</button>
        <strong id="periodo-agenda" style="align-self:center"></strong>
        <select class="selecao" id="filtro-funcionario"><option value="">Todos os profissionais</option></select>
        <select class="selecao" id="filtro-servico"><option value="">Todos os serviços</option></select>
        <select class="selecao" id="filtro-status">
          <option value="">Todos os status</option>
          <option value="pendente">Pendente</option>
          <option value="confirmado">Confirmado</option>
          <option value="parcial">Parcial</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <section class="painel">
        <div class="cabecalho-painel">
          <h2>Compromissos da semana</h2>
          <span class="texto-suave" id="quantidade-agendamentos"></span>
        </div>
        <div class="tabela-responsiva" id="conteudo-agenda"></div>
      </section>
    </main>
  </div>

  <div class="modal-fundo" id="modal-agendamento" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-agendamento">
    <div class="modal">
      <form id="formulario-agendamento">
        <div class="modal-cabecalho">
          <h2 id="titulo-modal-agendamento">Novo agendamento</h2>
          <button class="botao botao-icone" type="button" data-fechar-modal aria-label="Fechar">×</button>
        </div>
        <div class="modal-corpo">
          <div class="grade-formulario">
            <div class="grupo-campo campo-largo">
              <label for="agendamento-cliente-id">Cliente cadastrado</label>
              <select class="selecao" id="agendamento-cliente-id" name="cliente_id">
                <option value="">Informar manualmente</option>
              </select>
            </div>
            <div class="grupo-campo">
              <label for="agendamento-cliente">Nome do cliente *</label>
              <input class="campo" id="agendamento-cliente" name="cliente" maxlength="160" required>
            </div>
            <div class="grupo-campo">
              <label for="agendamento-telefone">Telefone</label>
              <input class="campo" id="agendamento-telefone" name="telefone" maxlength="30">
            </div>
            <div class="grupo-campo">
              <label for="agendamento-servico">Serviço *</label>
              <select class="selecao" id="agendamento-servico" name="servico_id" required>
                <option value="">Selecione</option>
              </select>
            </div>
            <div class="grupo-campo">
              <label for="agendamento-funcionario">Profissional *</label>
              <select class="selecao" id="agendamento-funcionario" name="funcionario_id" required>
                <option value="">Selecione</option>
              </select>
            </div>
            <div class="grupo-campo">
              <label for="agendamento-data">Data *</label>
              <input class="campo" id="agendamento-data" name="data_agendamento" type="date" required>
            </div>
            <div class="grupo-campo">
              <label for="agendamento-horario">Horário *</label>
              <input class="campo" id="agendamento-horario" name="horario_inicio" type="time" required>
            </div>
            <div class="grupo-campo campo-largo">
              <label for="agendamento-observacoes">Observações</label>
              <textarea class="area-texto" id="agendamento-observacoes" name="observacoes" maxlength="1500"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-rodape">
          <button class="botao" type="button" data-fechar-modal>Cancelar</button>
          <button class="botao botao-primario" type="submit">Salvar agendamento</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/api-localbarber.js?v=7"></script>
  <script src="../assets/js/agenda-dados.js"></script>
  <script src="../assets/js/theme-toggle.js"></script>
</body>
</html>
